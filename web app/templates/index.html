<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Risk Analyzer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f1f2e, #2c2c54);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            background: #2f2f4f;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-custom {
            background-color: #6c5ce7;
            border: none;
        }

        .btn-custom:hover {
            background-color: #5a4bd1;
        }

        .result-safe {
            color: #00ffae;
            font-weight: bold;
        }

        .result-danger {
            color: #ff4d4d;
            font-weight: bold;
        }

        pre {
            background: #1e1e2f;
            padding: 10px;
            border-radius: 10px;
            color: #ccc;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <div class="text-center mb-5">
        <h1>🔍 URL Risk Analyzer</h1>
        <p class="text-muted">Detect malicious links using AI + VirusTotal</p>
    </div>

    <div class="card p-4 mx-auto" style="max-width: 600px;">

        <form method="POST">
            <div class="mb-3">
                <input 
                    type="text" 
                    name="url" 
                    class="form-control form-control-lg"
                    placeholder="Enter URL (e.g. google.com)"
                    required
                >
            </div>

            <div class="d-grid">
                <button class="btn btn-custom btn-lg">
                    Analyze 🔎
                </button>
            </div>
        </form>

    </div>

    {% if score is not none %}
    <div class="card p-4 mt-4 mx-auto text-center" style="max-width: 600px;">

        <h3>Analysis Result</h3>

        <p><b>URL:</b> {{ url_input }}</p>

        <h1 class="{% if score > 50 %}result-danger{% else %}result-safe{% endif %}">
            {{ score }}/100
        </h1>

        <p class="{% if score > 50 %}result-danger{% else %}result-safe{% endif %}">
            {{ status }}
        </p>

    </div>
    {% endif %}

    {% if result %}
    <div class="card p-4 mt-4 mx-auto" style="max-width: 800px;">
        <h4>🔎 Detailed Analysis</h4>
        <pre>{{ result | tojson(indent=2) }}</pre>
    </div>
    {% endif %}

</div>

</body>
</html>
